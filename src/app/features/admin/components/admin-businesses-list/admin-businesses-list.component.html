<ion-card class="premium-card m-0 mt-4 mx-4 shadow-md border-radius-xl">
  <ion-list *ngIf="!isLoading; else skeleton" lines="none" class="p-0 m-0 bg-transparent">
    <ion-item-sliding *ngFor="let business of filteredBusinesses">
      <ion-item button detail="true" class="premium-item" (click)="viewBusiness(business)">
        <div slot="start" class="premium-business-logo">
          <img [src]="business.logo_url || getFallbackAvatar(business.name)" [alt]="business.name" (error)="business.logo_url = getFallbackAvatar(business.name)" />
        </div>
        <ion-label class="w-full">
          <h2 class="font-bold text-dark flex items-center">
            {{ business.name }}
            <ion-icon *ngIf="business.is_featured" name="star" color="warning" class="ml-1 text-base"></ion-icon>
          </h2>
          <p class="text-medium mt-1">Owner: {{ business.owner_name }}</p>
          <div class="mt-2 flex items-center gap-2">
            <span class="category-badge">{{ business.category_name }}</span>
            <span class="status-badge" [ngClass]="'status-' + business.status.toLowerCase()">
              {{ business.status }}
            </span>
          </div>
        </ion-label>
      </ion-item>

      <ion-item-options side="end">
        <!-- Options for PENDING status -->
        <ion-item-option *ngIf="business.status === BusinessStatus.PENDING" color="success" (click)="updateStatus(business, BusinessStatus.ACTIVE)">
          <ion-icon slot="icon-only" name="checkmark-circle-outline"></ion-icon>
        </ion-item-option>
        <ion-item-option *ngIf="business.status === BusinessStatus.PENDING" color="danger" (click)="updateStatus(business, BusinessStatus.REJECTED)">
          <ion-icon slot="icon-only" name="close-circle-outline"></ion-icon>
        </ion-item-option>

        <!-- Options for ACTIVE status -->
        <ion-item-option *ngIf="business.status === BusinessStatus.ACTIVE" color="danger" (click)="updateStatus(business, BusinessStatus.SUSPENDED)">
          <ion-icon slot="icon-only" name="ban-outline"></ion-icon>
        </ion-item-option>
        <ion-item-option *ngIf="business.status === BusinessStatus.ACTIVE" color="warning" (click)="toggleFeature(business)">
          <ion-icon slot="icon-only" [name]="business.is_featured ? 'star-outline' : 'star'"></ion-icon>
        </ion-item-option>

        <!-- Options for SUSPENDED / REJECTED status -->
        <ion-item-option *ngIf="business.status === BusinessStatus.SUSPENDED || business.status === BusinessStatus.REJECTED" color="success" (click)="updateStatus(business, BusinessStatus.ACTIVE)">
          <ion-icon slot="icon-only" name="refresh-outline"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>

    <ion-item *ngIf="filteredBusinesses.length === 0">
      <div class="flex flex-col items-center justify-center p-8 w-full text-center text-gray-500">
        <ion-icon name="business-outline" class="text-4xl mb-2 opacity-50"></ion-icon>
        <p>No businesses found matching your criteria.</p>
      </div>
    </ion-item>
  </ion-list>
</ion-card>

<ng-template #skeleton>
  <ion-card class="m-0 mt-4 shadow-sm border-radius-lg">
    <ion-list class="p-0 m-0">
      <ion-item *ngFor="let i of [1,2,3,4,5]">
        <div slot="start" class="premium-business-logo skeleton-logo">
          <ion-skeleton-text animated style="width: 100%; height: 100%; margin: 0;"></ion-skeleton-text>
        </div>
        <ion-label>
          <h2><ion-skeleton-text animated style="width: 50%"></ion-skeleton-text></h2>
          <p><ion-skeleton-text animated style="width: 80%"></ion-skeleton-text></p>
          <p><ion-skeleton-text animated style="width: 30%"></ion-skeleton-text></p>
        </ion-label>
        <ion-skeleton-text slot="end" animated style="width: 60px; height: 20px; border-radius: 4px;"></ion-skeleton-text>
      </ion-item>
    </ion-list>
  </ion-card>
</ng-template>
