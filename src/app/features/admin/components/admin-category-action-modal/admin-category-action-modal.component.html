<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>{{ isEditMode ? 'Edit Category' : 'New Category' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()" color="medium">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="categoryForm" (ngSubmit)="submit()">
    <div class="form-group">
      <ion-label class="field-label">Name <span class="required-star">*</span></ion-label>
      <ion-input type="text" formControlName="name" placeholder="e.g. Health & Wellness" class="custom-input"></ion-input>
      <div class="error-container">
        <ion-text color="danger" class="error-message" *ngIf="categoryForm.get('name')?.invalid && categoryForm.get('name')?.touched">
          Category name is required (min 2 characters)
        </ion-text>
      </div>
    </div>

    <div class="form-group">
      <ion-label class="field-label">Description</ion-label>
      <ion-textarea formControlName="description" rows="3" placeholder="Category description..." class="custom-textarea"></ion-textarea>
    </div>

    <div class="form-group switch-group">
      <ion-label class="field-label">Status</ion-label>
      <ion-item lines="none" class="toggle-item">
        <ion-label>{{ categoryForm.get('is_active')?.value ? 'Active' : 'Inactive' }}</ion-label>
        <ion-toggle formControlName="is_active" slot="end" color="primary"></ion-toggle>
      </ion-item>
    </div>
  </form>
</ion-content>

<ion-footer class="ion-no-border">
  <ion-toolbar>
    <div class="action-buttons">
      <ion-button *ngIf="isEditMode" fill="outline" color="danger" class="delete-btn" (click)="delete()">
        <ion-icon slot="start" name="trash-outline"></ion-icon>
        Delete
      </ion-button>
      
      <ion-button (click)="submit()" color="primary" class="save-btn" [class.full-width]="!isEditMode">
        <ion-icon slot="start" name="save-outline"></ion-icon>
        Save
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
