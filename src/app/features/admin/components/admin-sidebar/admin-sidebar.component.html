<div class="sidebar-header">
  <div class="header-content">
    <div class="logo-icon">
      <img src="assets/icon/BizzDeal.png" alt="BizzDeal Logo">
    </div>
    <div class="title-wrap">
      <h2>Admin Portal</h2>
      <p>Management & Insights</p>
    </div>
  </div>
</div>

<div class="sidebar-body">
  <div class="nav-list">
    <ion-item
      *ngFor="let p of adminPages"
      [routerLink]="[p.url]"
      routerDirection="root"
      routerLinkActive="selected-item"
      [routerLinkActiveOptions]="{ exact: false }"
      lines="none"
      class="nav-item"
      button
      detail="false"
      (click)="onItemClick()"
    >
      <ion-icon slot="start" [name]="p.icon + '-outline'" class="nav-icon"></ion-icon>
      <ion-label>{{ p.title }}</ion-label>
      <ion-icon slot="end" name="chevron-forward-outline" class="chevron-icon"></ion-icon>
    </ion-item>
  </div>
</div>

<div class="sidebar-footer">
  <ion-button expand="block" color="danger" fill="outline" class="logout-btn" (click)="logout()">
    <ion-icon slot="start" name="log-out-outline"></ion-icon>
    Logout
  </ion-button>
</div>
