<ion-header class="ion-no-border admin-child-header" collapse="fade" [translucent]="true" style="padding-top: 0px !important; --ion-safe-area-top: 0px;">
  <div class="admin-search-filter-bar">
    <ion-searchbar 
      [value]="searchQuery" 
      (ionInput)="onSearch($event)" 
      placeholder="Search by name, owner, category..." 
      mode="md" 
      class="premium-searchbar">
    </ion-searchbar>
    <button (click)="openFilter()" type="button" class="filter-icon-btn" aria-label="Filter by region">
      <ion-icon name="filter-outline"></ion-icon>
      <span *ngIf="stateId || districtId" class="filter-active-dot"></span>
    </button>
  </div>
  <ion-toolbar class="px-2 pb-2">
    <ion-segment [value]="segmentValue" (ionChange)="segmentChanged($event)" mode="ios" class="premium-segment">
      <ion-segment-button value="ALL">
        <ion-label>All</ion-label>
      </ion-segment-button>
      <ion-segment-button value="PENDING">
        <ion-label>Pending</ion-label>
      </ion-segment-button>
      <ion-segment-button value="ACTIVE">
        <ion-label>Active</ion-label>
      </ion-segment-button>
      <ion-segment-button value="SUSPENDED">
        <ion-label>Suspended</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content style="--background: #fff;">
  <app-admin-businesses-list [searchQuery]="searchQuery" [statusFilter]="segmentValue" [stateId]="stateId" [districtId]="districtId"></app-admin-businesses-list>
</ion-content>

<app-admin-region-filter-modal
  [isOpen]="isFilterOpen"
  [stateId]="stateId"
  [districtId]="districtId"
  (filterApplied)="onFilterApplied($event)"
  (closed)="isFilterOpen = false"
></app-admin-region-filter-modal>
