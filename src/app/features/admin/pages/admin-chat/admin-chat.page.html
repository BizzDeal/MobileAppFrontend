@if (!selectedConversationId()) {


  <ion-content style="--background: #fff;">
    <div class="admin-chat-container">
      <app-conversation-list (selectConversation)="onConversationSelect($event)"></app-conversation-list>
    </div>
  </ion-content>
} @else {
  <app-chat-room (closeChat)="onCloseChatRoom()"></app-chat-room>
}
