<div class="verify-email-container">
  <app-animated-background></app-animated-background>
  <div class="verify-email-card">
    <!-- Loading State -->
    <div *ngIf="isLoading()" class="state-container loading-state">
      <div class="spinner"></div>
      <h2>Verifying your email...</h2>
      <p>Please wait while we confirm your email address.</p>
    </div>

    <!-- Success State -->
    <div *ngIf="!isLoading() && isSuccess()" class="state-container success-state">
      <div class="icon-container success-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
      </div>
      <h2>Email Verified Successfully!</h2>
      <p>Your email has been confirmed. Your account is now pending admin approval.</p>
      <button class="bd-btn-primary" style="width: 100%" (click)="goToLogin()">Proceed to Login</button>
    </div>

    <!-- Error State -->
    <div *ngIf="!isLoading() && !isSuccess() && errorMessage()" class="state-container error-state">
      <div class="icon-container error-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </div>
      <h2>Verification Failed</h2>
      <p>{{ errorMessage() }}</p>
      <button class="bd-btn-outline" style="width: 100%; margin-top: 12px;" (click)="goToLogin()">Back to Login</button>
    </div>
  </div>
</div>
