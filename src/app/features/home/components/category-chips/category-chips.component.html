<section class="categories-filter-bar" [class.scrolled-mode]="isScrolled()">
  <div class="category-section-title-row">
    <h3 class="category-heading">
      Top Business in <span class="highlight-district">{{ districtName() || 'Srikakulam' }}</span>
    </h3>
  </div>

  <div class="chips-scroll-wrapper">
    <!-- All Deals / For You Tab -->
    <button 
      type="button"
      class="category-column-item" 
      [class.active]="selectedCategoryId() === 'ALL'"
      (click)="categorySelect.emit('ALL')">
      <div class="cat-icon-container">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
      </div>
      <span class="cat-label">For You</span>
      <div class="active-indicator"></div>
    </button>

    <!-- Dynamic Category Tabs -->
    @for (cat of categories(); track cat.id) {
      <button 
        type="button"
        class="category-column-item" 
        [class.active]="selectedCategoryId() === cat.id"
        (click)="categorySelect.emit(cat.id)">
        <div class="cat-icon-container">
          @if (cat.icon) {
            <span class="cat-emoji-icon">{{ cat.icon }}</span>
          } @else if (getCategoryIconType(cat.slug) === 'food') {
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8h1a4 4 0 0 1 0 8h-1"/>
              <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>
              <line x1="6" y1="1" x2="6" y2="4"/>
              <line x1="10" y1="1" x2="10" y2="4"/>
              <line x1="14" y1="1" x2="14" y2="4"/>
            </svg>
          } @else if (getCategoryIconType(cat.slug) === 'fashion') {
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.38 3.46L16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/>
            </svg>
          } @else if (getCategoryIconType(cat.slug) === 'mobiles') {
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="2" width="14" height="20" rx="3"/>
              <circle cx="12" cy="18" r="1" fill="currentColor"/>
            </svg>
          } @else if (getCategoryIconType(cat.slug) === 'electronics') {
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="12" rx="2"/>
              <line x1="2" y1="20" x2="22" y2="20"/>
            </svg>
          } @else if (getCategoryIconType(cat.slug) === 'beauty') {
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 3h6v4H9z"/>
              <path d="M9 7l3-4 3 4"/>
              <rect x="8" y="7" width="8" height="14" rx="2"/>
              <line x1="8" y1="13" x2="16" y2="13"/>
            </svg>
          } @else if (getCategoryIconType(cat.slug) === 'home') {
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 3h6l3 7H6l3-7z"/>
              <line x1="12" y1="10" x2="12" y2="18"/>
              <line x1="8" y1="21" x2="16" y2="21"/>
              <line x1="12" y1="18" x2="12" y2="21"/>
            </svg>
          } @else if (getCategoryIconType(cat.slug) === 'health') {
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
            </svg>
          } @else if (getCategoryIconType(cat.slug) === 'hotel') {
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 21h18"/>
              <path d="M6 18V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v14"/>
              <path d="M9 6h2M9 10h2M9 14h2M13 6h2M13 10h2M13 14h2"/>
            </svg>
          } @else if (getCategoryIconType(cat.slug) === 'auto') {
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 17h14M5 17a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.5L8 4h8l1.5 3H19a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2M5 17a2 2 0 1 0 4 0M15 17a2 2 0 1 0 4 0"/>
            </svg>
          } @else if (getCategoryIconType(cat.slug) === 'entertainment') {
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="6" width="20" height="12" rx="2"/>
              <path d="M6 12h4M8 10v4M15 11h.01M18 13h.01"/>
            </svg>
          } @else if (getCategoryIconType(cat.slug) === 'edu') {
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
              <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
          }
        </div>
        <span class="cat-label">{{ cat.name }}</span>
        <div class="active-indicator"></div>
      </button>
    }
  </div>
</section>
