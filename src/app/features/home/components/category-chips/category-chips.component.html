<section class="categories-filter-bar">
  <div class="chips-scroll-wrapper">
    <!-- All Chip -->
    <button 
      type="button"
      class="fk-chip-btn" 
      [class.active]="selectedCategoryId() === 'ALL'"
      (click)="categorySelect.emit('ALL')">
      <div class="chip-icon-box all-box">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
        </svg>
      </div>
      <span class="chip-label">All Deals</span>
    </button>

    <!-- Dynamic Category Chips -->
    @for (cat of categories(); track cat.id) {
      <button 
        type="button"
        class="fk-chip-btn" 
        [class.active]="selectedCategoryId() === cat.id"
        (click)="categorySelect.emit(cat.id)">
        <div class="chip-icon-box" 
          [style.background-color]="selectedCategoryId() === cat.id ? '#2874f0' : getCategoryColor(cat.color, cat.slug) + '1a'" 
          [style.color]="selectedCategoryId() === cat.id ? '#ffffff' : getCategoryColor(cat.color, cat.slug)">
          
          @if (getCategoryIconType(cat.slug) === 'food') {
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8h1a4 4 0 0 1 0 8h-1"/>
              <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>
              <line x1="6" y1="1" x2="6" y2="4"/>
              <line x1="10" y1="1" x2="10" y2="4"/>
              <line x1="14" y1="1" x2="14" y2="4"/>
            </svg>
          } @else if (getCategoryIconType(cat.slug) === 'fashion') {
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20.38 3.46L16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/>
            </svg>
          } @else if (getCategoryIconType(cat.slug) === 'health') {
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
            </svg>
          } @else if (getCategoryIconType(cat.slug) === 'tech') {
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="2" width="20" height="20" rx="5"/>
              <rect x="9" y="9" width="6" height="6"/>
              <line x1="9" y1="1" x2="9" y2="2"/>
              <line x1="15" y1="1" x2="15" y2="2"/>
              <line x1="9" y1="22" x2="9" y2="23"/>
              <line x1="15" y1="22" x2="15" y2="23"/>
              <line x1="22" y1="9" x2="23" y2="9"/>
              <line x1="22" y1="15" x2="23" y2="15"/>
              <line x1="1" y1="9" x2="2" y2="9"/>
              <line x1="1" y1="15" x2="2" y2="15"/>
            </svg>
          } @else if (getCategoryIconType(cat.slug) === 'hotel') {
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 21h18"/>
              <path d="M6 18V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v14"/>
              <path d="M9 6h2M9 10h2M9 14h2M13 6h2M13 10h2M13 14h2"/>
            </svg>
          } @else if (getCategoryIconType(cat.slug) === 'home') {
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          } @else if (getCategoryIconType(cat.slug) === 'edu') {
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
              <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
          }
        </div>
        <span class="chip-label">{{ cat.name }}</span>
      </button>
    }
  </div>
</section>
