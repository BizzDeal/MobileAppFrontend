<section class="categories-filter-bar" [class.scrolled-mode]="isScrolled()">
  <div class="chips-scroll-wrapper">
    <!-- All Deals Column -->
    <button 
      type="button"
      class="category-column-item" 
      [class.active]="selectedCategoryId() === 'ALL'"
      (click)="categorySelect.emit('ALL')">
      <div class="cat-icon-container all-container">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="3" y="3" width="7" height="7" rx="2"/>
          <rect x="14" y="3" width="7" height="7" rx="2"/>
          <rect x="14" y="14" width="7" height="7" rx="2"/>
          <rect x="3" y="14" width="7" height="7" rx="2"/>
        </svg>
      </div>
      <span class="cat-label">All Deals</span>
    </button>

    <!-- Dynamic Category Columns -->
    @for (cat of categories(); track cat.id) {
      <button 
        type="button"
        class="category-column-item" 
        [class.active]="selectedCategoryId() === cat.id"
        (click)="categorySelect.emit(cat.id)">
        <div class="cat-icon-container" 
          [style.background-color]="selectedCategoryId() === cat.id ? '#2874f0' : getCategoryColor(cat.color, cat.slug) + '18'" 
          [style.color]="selectedCategoryId() === cat.id ? '#ffffff' : getCategoryColor(cat.color, cat.slug)">
          
          @if (getCategoryIconType(cat.slug) === 'food') {
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M18 8h1a4 4 0 0 1 0 8h-1"/>
              <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>
              <line x1="6" y1="1" x2="6" y2="4"/>
              <line x1="10" y1="1" x2="10" y2="4"/>
              <line x1="14" y1="1" x2="14" y2="4"/>
            </svg>
          } @else if (getCategoryIconType(cat.slug) === 'fashion') {
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M20.38 3.46L16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/>
            </svg>
          } @else if (getCategoryIconType(cat.slug) === 'beauty') {
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
            </svg>
          } @else if (getCategoryIconType(cat.slug) === 'health') {
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
            </svg>
          } @else if (getCategoryIconType(cat.slug) === 'tech') {
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2">
              <rect x="2" y="3" width="20" height="14" rx="2"/>
              <line x1="8" y1="21" x2="16" y2="21"/>
              <line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
          } @else if (getCategoryIconType(cat.slug) === 'hotel') {
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M3 21h18"/>
              <path d="M6 18V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v14"/>
              <path d="M9 6h2M9 10h2M9 14h2M13 6h2M13 10h2M13 14h2"/>
            </svg>
          } @else if (getCategoryIconType(cat.slug) === 'home') {
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          } @else if (getCategoryIconType(cat.slug) === 'auto') {
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M5 17h14M5 17a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.5L8 4h8l1.5 3H19a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2M5 17a2 2 0 1 0 4 0M15 17a2 2 0 1 0 4 0"/>
            </svg>
          } @else if (getCategoryIconType(cat.slug) === 'entertainment') {
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2">
              <rect x="2" y="6" width="20" height="12" rx="2"/>
              <path d="M6 12h4M8 10v4M15 11h.01M18 13h.01"/>
            </svg>
          } @else if (getCategoryIconType(cat.slug) === 'edu') {
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
              <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
          }
        </div>
        <span class="cat-label">{{ cat.name }}</span>
      </button>
    }
  </div>
</section>
