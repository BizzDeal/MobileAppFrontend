<!-- Fixed Sticky Header Container (Header + Search pinned at top) -->
<div class="sticky-top-header">
  <app-home-header 
    [customer]="customer" 
    [wallet]="wallet" 
    [unreadCount]="unreadNotificationsCount"
    (walletClick)="walletClick.emit()" 
    (notificationClick)="notificationClick.emit()"
    (searchClick)="searchSubmit.emit('')"
    (searchChange)="searchChange.emit($event)" 
    (searchSubmit)="searchSubmit.emit($event)" 
    [isScrolled]="isScrolled"
  />
</div>

<!-- Main Body Area displaying the Wallet Screen with no header (Matches Screenshot) -->
<div class="customer-wallet-body">
  <app-wallet-view 
    [hideHeader]="true"
    [customer]="customer"
    [customerName]="customer.name"
    (redeemClick)="onRedeem()"
  />
</div>
