@if (stores().length > 0) {
<section 
  class="fk-featured-section"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()">

  <!-- Carousel Viewport (overflow hidden, no scroll) -->
  <div class="fk-banners-viewport" #viewportEl
    (touchstart)="onTouchStart($event)"
    (touchmove)="onTouchMove($event)"
    (touchend)="onTouchEnd()">
    <div class="fk-banners-track" #trackEl
      [style.transform]="trackTransform()"
      [style.transition]="trackTransition()"
      (transitionend)="onTransitionEnd()">
      @for (store of displayStores(); track (store.id || '') + '-' + $index; let i = $index) {
        <div class="fk-banner-card" [ngClass]="'variant-' + (i % 5)"
          [style.width.px]="cardWidth()"
          [style.min-width.px]="cardWidth()"
          (click)="storeClick.emit(store)">
          
          <!-- Banner Video / Image / Gradient Background -->
          <div class="banner-media-bg" [style.background]="getAvatarColor(store.name)">
            @if (store.bannerUrl || store.logoUrl) {
              <img loading="lazy" [appCachedImg]="store.bannerUrl || store.logoUrl" [alt]="store.name" class="media-img" />
            }
            <div class="gradient-overlay"></div>
          </div>

          <!-- Banner Content Area -->
          <div class="banner-inner">
            <!-- Banner Clean Bottom Bar -->
            <div class="banner-footer">
              <div class="store-headline-box">
                <h3 class="banner-store-title">{{ store.name }}</h3>
              </div>
            </div>
          </div>

        </div>
      }
    </div>
  </div>

</section>
}
