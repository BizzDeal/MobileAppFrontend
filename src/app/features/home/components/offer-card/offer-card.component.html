<div class="offer-card" (click)="cardClick.emit(offer())">
  <!-- Image Header & Discount Badge -->
  <div class="card-image-box" [style.background-image]="'url(' + (offer().imageUrl || 'https://images.unsplash.com/photo-1533089860892-a7c6f0a88666?w=600&auto=format&fit=crop&q=80') + ')'">
    <div class="image-overlay"></div>
    <span class="discount-badge">
      {{ offer().discount_type === 'PERCENTAGE' ? offer().discount_value + '% OFF' : '₹' + offer().discount_value + ' OFF' }}
    </span>
    <span class="timer-badge">
      <ion-icon name="time-outline" /> {{ getDaysLeft(offer().end_date) }}
    </span>
  </div>

  <!-- Content Section -->
  <div class="card-content">
    <div class="business-meta">
      <img [src]="offer().businessLogoUrl || 'https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?w=150&auto=format&fit=crop&q=80'" alt="logo" class="biz-logo" />
      <div class="biz-info">
        <span class="biz-name">{{ offer().businessName || 'BizzDeal Partner' }}</span>
        <span class="biz-location">
          <ion-icon name="pricetag-outline" /> {{ offer().offer_type }}
        </span>
      </div>
    </div>

    <h3 class="offer-title">{{ offer().title }}</h3>
    <p class="offer-desc">{{ offer().description }}</p>

    <div class="card-footer">
      <span class="claim-stats">⚡ Limited Time Deal</span>
      <button 
        type="button" 
        class="claim-btn bd-btn-primary" 
        (click)="$event.stopPropagation(); claimClick.emit(offer())">
        Claim Deal
      </button>
    </div>
  </div>
</div>
