<ion-header class="ion-no-border">
  <ion-toolbar class="cropper-toolbar">
    <ion-buttons slot="start">
      <ion-button [disabled]="loading() || cropping()" (click)="cancel()" aria-label="Cancel">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title>{{ title }}</ion-title>

    <ion-buttons slot="end">
      <button type="button" class="header-reset-btn" [disabled]="loading() || cropping()" (click)="reset()">
        Reset
      </button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="cropper-content" [scrollY]="false">
  <div class="cropper-layout">

    @if (loading()) {
      <div class="loading-overlay">
        <ion-spinner name="crescent"></ion-spinner>
        <p>Loading photo...</p>
      </div>
    }

    <!-- Main Cropper Viewport -->
    <div class="cropper-viewport">
      <image-cropper
        [imageFile]="imageFile()"
        [imageBase64]="imageBase64()"
        [imageURL]="imageURL()"
        [maintainAspectRatio]="maintainAspectRatio()"
        [aspectRatio]="currentAspectRatio()"
        [canvasRotation]="canvasRotation()"
        [transform]="transform()"
        [roundCropper]="isRoundCropperActive()"
        [autoCrop]="true"
        [containWithinAspectRatio]="false"
        [output]="'base64'"
        [format]="'jpeg'"
        [imageQuality]="92"
        [checkImageType]="false"
        (imageCropped)="onImageCropped($event)"
        (imageLoaded)="onImageLoaded($event)"
        (cropperReady)="onCropperReady()"
        (loadImageFailed)="onLoadImageFailed()">
      </image-cropper>
    </div>

    <!-- WhatsApp Style Controls Panel -->
    <div class="cropper-controls">
      
      <!-- Aspect Ratio Filter Pills -->
      <div class="aspect-pills-row">
        <button
          type="button"
          class="aspect-pill"
          [class.active]="activeRatioMode() === 'free'"
          (click)="setAspectRatioMode('free')"
          [disabled]="loading() || cropping()">
          <ion-icon name="crop-outline"></ion-icon>
          <span>Free</span>
        </button>

        <button
          type="button"
          class="aspect-pill"
          [class.active]="activeRatioMode() === 'original'"
          (click)="setAspectRatioMode('original')"
          [disabled]="loading() || cropping()">
          <ion-icon name="scan-outline"></ion-icon>
          <span>Original</span>
        </button>

        <button
          type="button"
          class="aspect-pill"
          [class.active]="activeRatioMode() === '1:1'"
          (click)="setAspectRatioMode('1:1')"
          [disabled]="loading() || cropping()">
          <ion-icon name="square-outline"></ion-icon>
          <span>1:1</span>
        </button>

        <button
          type="button"
          class="aspect-pill"
          [class.active]="activeRatioMode() === '16:9'"
          (click)="setAspectRatioMode('16:9')"
          [disabled]="loading() || cropping()">
          <span>16:9</span>
        </button>

        <button
          type="button"
          class="aspect-pill"
          [class.active]="activeRatioMode() === '4:3'"
          (click)="setAspectRatioMode('4:3')"
          [disabled]="loading() || cropping()">
          <span>4:3</span>
        </button>
      </div>

      <!-- Quick Action Controls (Rotate 90°, Flip, Zoom) -->
      <div class="tool-actions-row">
        <button
          type="button"
          class="tool-btn rotate-btn"
          (click)="rotate90()"
          [disabled]="loading() || cropping()"
          title="Rotate 90°">
          <ion-icon name="refresh-outline"></ion-icon>
          <span>Rotate</span>
        </button>

        <button
          type="button"
          class="tool-btn"
          [class.active]="flipH()"
          (click)="toggleFlipH()"
          [disabled]="loading() || cropping()"
          title="Flip Horizontal">
          <ion-icon name="swap-horizontal-outline"></ion-icon>
          <span>Flip H</span>
        </button>

        <button
          type="button"
          class="tool-btn"
          [class.active]="flipV()"
          (click)="toggleFlipV()"
          [disabled]="loading() || cropping()"
          title="Flip Vertical">
          <ion-icon name="swap-vertical-outline"></ion-icon>
          <span>Flip V</span>
        </button>

        <div class="zoom-buttons-group">
          <button
            type="button"
            class="zoom-btn"
            (click)="zoomOut()"
            [disabled]="loading() || cropping() || zoomScale() <= 0.5"
            title="Zoom Out">
            <ion-icon name="remove-outline"></ion-icon>
          </button>
          <span class="zoom-label">{{ zoomScale().toFixed(1) }}x</span>
          <button
            type="button"
            class="zoom-btn"
            (click)="zoomIn()"
            [disabled]="loading() || cropping() || zoomScale() >= 3.0"
            title="Zoom In">
            <ion-icon name="add-outline"></ion-icon>
          </button>
        </div>
      </div>

    </div>

  </div>
</ion-content>

<ion-footer class="ion-no-border cropper-footer">
  <div class="footer-actions-container">
    <button
      type="button"
      class="footer-cancel-btn"
      [disabled]="loading() || cropping()"
      (click)="cancel()">
      Cancel
    </button>

    <button
      type="button"
      class="footer-done-btn"
      [disabled]="loading() || cropping()"
      (click)="applyCrop()">
      @if (cropping()) {
        <ion-spinner name="crescent" class="btn-spinner"></ion-spinner>
        <span>Saving...</span>
      } @else {
        <ion-icon name="checkmark-outline"></ion-icon>
        <span>Done</span>
      }
    </button>
  </div>
</ion-footer>
