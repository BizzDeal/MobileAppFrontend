<div class="skeleton-card-container">
  @for (item of countArray; track $index) {
    <ion-card class="skeleton-card">
      <div class="skeleton-image-box">
        <ion-skeleton-text animated style="width: 100%; height: 100%; margin: 0;"></ion-skeleton-text>
      </div>
      <div class="skeleton-content-box">
        <div class="skeleton-header-row">
          <ion-skeleton-text animated style="width: 60%; height: 18px; border-radius: 6px;"></ion-skeleton-text>
          <ion-skeleton-text animated style="width: 25%; height: 18px; border-radius: 6px;"></ion-skeleton-text>
        </div>
        <ion-skeleton-text animated style="width: 85%; height: 14px; margin-top: 10px; border-radius: 4px;"></ion-skeleton-text>
        <ion-skeleton-text animated style="width: 45%; height: 14px; margin-top: 6px; border-radius: 4px;"></ion-skeleton-text>
      </div>
    </ion-card>
  }
</div>
