<div class="skeleton-profile-container">
  <!-- Profile Header Card -->
  <div class="skeleton-profile-card">
    <div class="skeleton-avatar-lg">
      <ion-skeleton-text animated style="width: 100%; height: 100%; border-radius: 50%; margin: 0;"></ion-skeleton-text>
    </div>
    <ion-skeleton-text animated style="width: 50%; height: 22px; margin-top: 14px; border-radius: 6px;"></ion-skeleton-text>
    <ion-skeleton-text animated style="width: 35%; height: 14px; margin-top: 8px; border-radius: 4px;"></ion-skeleton-text>
    <ion-skeleton-text animated style="width: 25%; height: 24px; margin-top: 12px; border-radius: 12px;"></ion-skeleton-text>
  </div>

  <!-- Stats Grid Card -->
  <div class="skeleton-stats-card">
    <div class="skeleton-stat-col">
      <ion-skeleton-text animated style="width: 60%; height: 20px; border-radius: 4px;"></ion-skeleton-text>
      <ion-skeleton-text animated style="width: 80%; height: 12px; margin-top: 6px; border-radius: 4px;"></ion-skeleton-text>
    </div>
    <div class="skeleton-stat-col">
      <ion-skeleton-text animated style="width: 60%; height: 20px; border-radius: 4px;"></ion-skeleton-text>
      <ion-skeleton-text animated style="width: 80%; height: 12px; margin-top: 6px; border-radius: 4px;"></ion-skeleton-text>
    </div>
    <div class="skeleton-stat-col">
      <ion-skeleton-text animated style="width: 60%; height: 20px; border-radius: 4px;"></ion-skeleton-text>
      <ion-skeleton-text animated style="width: 80%; height: 12px; margin-top: 6px; border-radius: 4px;"></ion-skeleton-text>
    </div>
  </div>

  <!-- Menu List Rows -->
  <div class="skeleton-menu-card">
    @for (item of [1, 2, 3, 4]; track $index) {
      <div class="skeleton-menu-row">
        <ion-skeleton-text animated style="width: 24px; height: 24px; border-radius: 6px; margin: 0;"></ion-skeleton-text>
        <ion-skeleton-text animated style="width: 55%; height: 16px; border-radius: 4px;"></ion-skeleton-text>
        <ion-skeleton-text animated style="width: 16px; height: 16px; border-radius: 4px; margin-left: auto;"></ion-skeleton-text>
      </div>
    }
  </div>
</div>
